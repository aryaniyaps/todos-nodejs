schemaVersion: software-factory.project/v4
development:
  prepare: [npm, ci]
  initialize: [npx, prisma, generate]
  start: [npm, run, dev]
  health: [sh, -c, 'curl -fsS "http://127.0.0.1:${PORT:-3000}/api/todos" >/dev/null']
inputs: []
automations:
  - schemaVersion: software-factory.automation/v1
    id: semgrep
    schedule: '0 3 * * 1'
    daggerFunction: semgrep
    issueTitle: Fix Semgrep findings
    task: Repair findings or evolve this repository's local Semgrep rules.
  - schemaVersion: software-factory.automation/v1
    id: alint
    schedule: '0 3 * * 2'
    daggerFunction: alint
    issueTitle: Fix Alint findings
    task: Repair repository structure or evolve this repository's Alint policy.
  - schemaVersion: software-factory.automation/v1
    id: ls-lint
    schedule: '0 3 * * 3'
    daggerFunction: ls-lint
    issueTitle: Fix repository naming findings
    task: Repair names or evolve this repository's ls-lint conventions.
