schemaVersion: software-factory.project/v4
development:
  prepare: [npm, ci]
  initialize: [sh, -c, 'DATABASE_URL=file:./dev.db npx prisma db push --skip-generate']
  start: [sh, -c, 'PORT=3000 DATABASE_URL=file:./dev.db npm run dev']
  health: [sh, -c, 'curl -fsS -H "Authorization: Bearer ${FACTORY_TODOS_AUTH_TOKEN}" "http://127.0.0.1:${PORT:-3000}/api/todos" >/dev/null']
inputs:
  - name: FACTORY_TODOS_AUTH_BASE_URL
    kind: setting
    scopes: [qualification]
  - name: FACTORY_TODOS_AUTH_TOKEN
    kind: secret
    scopes: [development, qualification]
automations:
  - schemaVersion: software-factory.automation/v1
    id: semgrep
    schedule: '0 3 * * 1'
    daggerFunction: semgrep
    issueTitle: Fix Semgrep findings
    task: Repair findings or evolve this repository's local Semgrep rules.
  - schemaVersion: software-factory.automation/v1
    id: alint
    schedule: '0 3 * * 2'
    daggerFunction: alint
    issueTitle: Fix Alint findings
    task: Repair repository structure or evolve this repository's Alint policy.
  - schemaVersion: software-factory.automation/v1
    id: ls-lint
    schedule: '0 3 * * 3'
    daggerFunction: ls-lint
    issueTitle: Fix repository naming findings
    task: Repair names or evolve this repository's ls-lint conventions.
